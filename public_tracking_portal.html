<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pelacakan Servis HP - HF CELL</title>
  <meta name="description" content="Lacak status servis handphone, estimasi biaya, dan verifikasi masa aktif kartu garansi toko secara mandiri dan realtime.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-primary: #0B0F19;
      --bg-card: #151C2C;
      --bg-card-glass: rgba(21, 28, 44, 0.85);
      --bg-subtle: #1E293B;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.3);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --primary: #6366F1;
      --primary-light: #818CF8;
      --primary-dark: #4F46E5;
      --primary-glow: rgba(99, 102, 241, 0.35);

      --success: #10B981;
      --success-light: #34D399;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-glow: rgba(16, 185, 129, 0.3);

      --warning: #F59E0B;
      --warning-bg: rgba(245, 158, 11, 0.12);

      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);

      --wa-color: #25D366;
      --wa-dark: #128C7E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(11, 15, 25, 0) 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 520px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header Bar */
    header {
      text-align: center;
      margin-bottom: 6px;
    }

    .store-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid var(--border-accent);
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--primary-light);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .store-badge svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Card Box */
    .card {
      background: var(--bg-card-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.14);
    }

    /* Search Box Form */
    .search-box {
      display: flex;
      gap: 8px;
      background: var(--bg-subtle);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      margin-top: 4px;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .search-box input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }

    .search-box button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .search-box button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* Ticket Header Banner */
    .ticket-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 18px;
    }

    .ticket-num-badge {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ticket-num-badge .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      font-weight: 700;
    }

    .ticket-num-badge .value {
      font-size: 1.18rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      display: inline-flex;
      align-items: center;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .copy-btn:hover {
      color: var(--primary-light);
    }

    /* Live Badge Indicator */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.14);
      color: var(--success-light);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    /* Status Stepper (Fase 1) */
    .stepper-container {
      margin-bottom: 22px;
    }

    .stepper-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    .stepper {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    .step-item {
      display: flex;
      position: relative;
      padding-bottom: 22px;
    }

    .step-item:last-child {
      padding-bottom: 4px;
    }

    .step-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 17px;
      top: 34px;
      bottom: 0;
      width: 2px;
      background: var(--border-color);
      z-index: 1;
      transition: background 0.3s ease;
    }

    .step-item.completed:not(:last-child)::before {
      background: var(--primary);
    }

    .step-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-subtle);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      z-index: 2;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .step-item.active .step-icon-wrap {
      background: var(--primary);
      border-color: var(--primary-light);
      box-shadow: 0 0 16px var(--primary-glow);
    }

    .step-item.completed .step-icon-wrap {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
    }

    .step-icon-wrap svg {
      width: 16px;
      height: 16px;
      fill: var(--text-dim);
      transition: fill 0.3s;
    }

    .step-item.active .step-icon-wrap svg {
      fill: #FFFFFF;
    }

    .step-item.completed .step-icon-wrap svg {
      fill: var(--primary-light);
    }

    .step-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .step-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-item.active .step-title {
      color: #FFFFFF;
      font-weight: 700;
    }

    .step-item.completed .step-title {
      color: var(--text-main);
    }

    .step-subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .step-item.active .step-subtitle {
      color: var(--primary-light);
    }

    .step-badge {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--primary-glow);
      color: var(--primary-light);
      font-weight: 700;
    }

    /* Device & Service Info Grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: rgba(30, 41, 59, 0.45);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .info-item.full-width {
      grid-column: span 2;
    }

    .info-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }

    .info-value {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
    }

    .info-value.highlight {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--success-light);
    }

    /* Phase 2: Warranty Card & Countdown */
    .warranty-banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.08) 100%);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .warranty-banner.expired {
      background: linear-gradient(135deg, rgba(100, 116, 139, 0.15) 0%, rgba(51, 65, 85, 0.08) 100%);
      border-color: rgba(100, 116, 139, 0.35);
    }

    .warranty-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .warranty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--success);
      color: #064E3B;
      box-shadow: 0 0 14px var(--success-glow);
    }

    .warranty-banner.expired .warranty-badge {
      background: #475569;
      color: #F1F5F9;
      box-shadow: none;
    }

    .countdown-box {
      text-align: right;
    }

    .countdown-days {
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .countdown-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .warranty-dates {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .warranty-dates strong {
      color: #FFFFFF;
    }

    /* Warranty Terms Accordion */
    .terms-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .terms-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .terms-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .terms-list li {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .terms-list li svg {
      width: 14px;
      height: 14px;
      fill: var(--warning);
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Action Buttons */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-wa {
      background-color: var(--wa-color);
      color: #064E3B;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.25);
    }

    .btn-wa:hover {
      background-color: #20BD5A;
      transform: translateY(-1px);
    }

    .btn-refresh {
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
    }

    /* Loading Spinner */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty / Not Found State */
    .empty-state {
      text-align: center;
      padding: 40px 16px;
    }

    .empty-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 28px;
      height: 28px;
      fill: var(--warning);
    }

    .empty-state h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Footer Branding */
    footer {
      text-align: center;
      margin-top: 14px;
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    footer a {
      color: var(--primary-light);
      text-decoration: none;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="store-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2zm0-10h2v8h-2z"/></svg>
        <span id="store-name-badge">HF CELL SERVICE</span>
      </div>
      <h1>Cek Status Servis</h1>
      <p class="subtitle">Lacak progres servis HP & masa garansi secara realtime</p>
    </header>

    <!-- Search Form (Bisa dipakai jika user datang tanpa ?ticket=) -->
    <div class="card" id="search-card" style="padding: 14px 16px;">
      <form id="search-form" onsubmit="handleManualSearch(event)">
        <div class="search-box">
          <input type="text" id="ticket-input" placeholder="Masukkan No. Tiket (misal: SRV-2026-0001)" autocomplete="off">
          <button type="submit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            Lacak
          </button>
        </div>
      </form>
    </div>

    <!-- Main Content Area -->
    <main id="content-area">
      <!-- Loading State Default -->
      <div class="card">
        <div class="spinner-wrap">
          <div class="spinner"></div>
          <p style="font-size: 0.88rem; color: var(--text-muted);">Menghubungkan ke sistem Supabase...</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; <span id="current-year">2026</span> <span id="footer-store-name">HF CELL</span> • Sistem Manajemen POS Servis HP</p>
    </footer>
  </div>

  <!-- Toast Element -->
  <div id="toast" class="toast">Tersalin ke clipboard!</div>

  <script>
    // -------------------------------------------------------------
    // Konfigurasi Supabase Project & Kredensial Publik (Anon Key)
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://ombcjdtbfbyrgnpijosr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9J4BxCLzc4H2iJdRPT_eUw_3UNmrIMQ';

    // Inisialisasi Supabase Client via CDN
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTicketNumber = '';
    let realtimeChannel = null;

    document.getElementById('current-year').textContent = new Date().getFullYear();

    // Jalankan saat dokumen dimuat
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ticketParam = urlParams.get('ticket');

      if (ticketParam && ticketParam.trim()) {
        const cleanTicket = ticketParam.trim();
        document.getElementById('ticket-input').value = cleanTicket;
        fetchTicketData(cleanTicket);
      } else {
        renderSearchPrompt();
      }
    });

    // Handle pencarian manual
    function handleManualSearch(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('ticket-input');
      const val = input.value.trim();
      if (!val) {
        showToast('Silakan masukkan nomor tiket servis.');
        return;
      }

      // Update URL query string tanpa reload halaman
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('ticket', val);
      window.history.pushState({}, '', newUrl);

      fetchTicketData(val);
    }

    // Tampilan awal jika belum ada parameter ?ticket=
    function renderSearchPrompt() {
      const main = document.getElementById('content-area');
      main.innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </div>
            <h3>Masukkan Nomor Tiket</h3>
            <p>Ketik nomor tiket servis atau pindai QR Code yang tertera pada nota fisik thermal Anda untuk melihat status pengerjaan unit secara langsung.</p>
          </div>
        </div>
      `;
    }

    // Tampilkan Loading
    function renderLoading() {
      const main = document.getElementById('content-area');
      main.innerHTML = `
        <div class="card">
          <div class="spinner-wrap">
            <div class="spinner"></div>
            <p style="font-size: 0.88rem; color: var(--text-muted);">Memuat data tiket servis...</p>
          </div>
        </div>
      `;
    }

    // Format Rupiah
    function formatRupiah(amount) {
      if (amount === null || amount === undefined || isNaN(amount)) return 'Rp 0';
      return 'Rp ' + Number(amount).toLocaleString('id-ID');
    }

    // Format Tanggal Indonesia
    function formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return dateStr;
      }
    }

    function formatDateShort(date) {
      if (!date) return '-';
      return date.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }

    // Ambil Data Tiket dari Supabase
    async function fetchTicketData(ticketNo) {
      currentTicketNumber = ticketNo;
      renderLoading();

      try {
        const { data, error } = await supabase
          .from('service_tickets')
          .select('*')
          .eq('ticket_number', ticketNo)
          .maybeSingle();

        if (error) {
          console.error('[SUPABASE QUERY ERROR]', error);
          renderError(`Terjadi kendala saat membaca data: ${error.message}`);
          return;
        }

        if (!data) {
          renderNotFound(ticketNo);
          return;
        }

        renderTicketDetail(data);
        setupRealtimeListener(ticketNo);
      } catch (err) {
        console.error('[FETCH ERROR]', err);
        renderError('Gagal terhubung ke server. Pastikan koneksi internet Anda aktif.');
      }
    }

    // Pasang Realtime Listener untuk Update Live
    function setupRealtimeListener(ticketNo) {
      if (realtimeChannel) {
        supabase.removeChannel(realtimeChannel);
      }

      realtimeChannel = supabase
        .channel(`ticket-live-${ticketNo}`)
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'service_tickets',
            filter: `ticket_number=eq.${ticketNo}`
          },
          (payload) => {
            console.log('⚡ [REALTIME UPDATE DITERIMA]', payload.new);
            showToast('Data servis baru saja diperbarui oleh teknisi!');
            renderTicketDetail(payload.new);
          }
        )
        .subscribe();
    }

    // Render Tampilan Utama Detail Tiket
    function renderTicketDetail(ticket) {
      const main = document.getElementById('content-area');
      const statusRaw = (ticket.status || 'Masuk').trim();
      const statusLower = statusRaw.toLowerCase();

      const isPickedUpOrPaid = statusLower === 'diambil' || statusLower === 'selesai diambil';
      const isCancelled = statusLower === 'batal';
      const isCompleted = statusLower === 'selesai' || isPickedUpOrPaid;

      // Status Stepper Index (0: Masuk, 1: Analisa/Pending_Part, 2: Proses, 3: Selesai/Diambil)
      let currentStepIndex = 0;
      if (statusLower === 'masuk') currentStepIndex = 0;
      else if (statusLower === 'analisa' || statusLower === 'pending_part') currentStepIndex = 1;
      else if (statusLower === 'proses' || statusLower === 'sedang dikerjakan') currentStepIndex = 2;
      else if (statusLower === 'selesai' || isPickedUpOrPaid) currentStepIndex = 3;

      // Nama Perangkat
      const deviceName = `${ticket.device_brand || ''} ${ticket.device_model || ''}`.trim() || 'Handphone';
      const customerName = ticket.customer_name || 'Pelanggan';

      // Hitung Garansi (Fase 2)
      const warrantyDays = Number(ticket.warranty_days) || 0;
      let isWarrantyActive = false;
      let warrantyEndDate = null;
      let daysRemaining = 0;

      if (isPickedUpOrPaid && warrantyDays > 0) {
        const baseDate = ticket.updated_at ? new Date(ticket.updated_at) : new Date();
        warrantyEndDate = new Date(baseDate.getTime() + (warrantyDays * 24 * 60 * 60 * 1000));
        const now = new Date();
        const diffTime = warrantyEndDate - now;
        daysRemaining = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        isWarrantyActive = daysRemaining > 0;
      }

      // WhatsApp Store Contact
      const defaultStoreWa = '6281234567890';
      const waMsg = encodeURIComponent(`Halo Admin HF Cell, saya ingin menanyakan progres tiket #${ticket.ticket_number} (${deviceName} - ${customerName}).`);
      const waLink = `https://wa.me/${defaultStoreWa}?text=${waMsg}`;

      let html = `
        <div class="card">
          <!-- Ticket Header Banner -->
          <div class="ticket-header">
            <div class="ticket-num-badge">
              <span class="label">Nomor Tiket</span>
              <div class="value">
                #${ticket.ticket_number}
                <button class="copy-btn" onclick="copyTicket('${ticket.ticket_number}')" title="Salin No. Tiket">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
              </div>
            </div>
            <div class="live-badge">
              <div class="pulse-dot"></div>
              <span>${isPickedUpOrPaid ? 'Unit Diambil' : (isCancelled ? 'Dibatalkan' : 'Live Status')}</span>
            </div>
          </div>
      `;

      // -------------------------------------------------------------
      // FASE 2: TIKET SELESAI DIAMBIL / LUNAS (GARANSI ELEKTRONIK)
      // -------------------------------------------------------------
      if (isPickedUpOrPaid) {
        html += `
          <div class="warranty-banner ${isWarrantyActive ? '' : 'expired'}">
            <div class="warranty-header">
              <div class="warranty-badge">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                ${isWarrantyActive ? 'Garansi Aktif' : 'Garansi Berakhir'}
              </div>
              <div class="countdown-box">
                <div class="countdown-days">${isWarrantyActive ? daysRemaining + ' Hari' : 'Kedaluwarsa'}</div>
                <div class="countdown-label">${isWarrantyActive ? 'Sisa Masa Garansi' : 'Status Klaim'}</div>
              </div>
            </div>

            <div class="warranty-dates">
              <div>Garansi Toko: <strong>${warrantyDays} Hari</strong></div>
              <div>Berlaku s/d: <strong>${warrantyEndDate ? formatDateShort(warrantyEndDate) : '-'}</strong></div>
            </div>
          </div>

          <!-- Syarat Klaim Garansi -->
          <div class="terms-card">
            <div class="terms-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--warning)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
              Syarat Singkat Klaim Garansi Toko
            </div>
            <ul class="terms-list">
              <li>
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                <span>Segel fisik toko pada unit masih dalam keadaan <strong>utuh, tidak robek, atau rusak</strong>.</span>
              </li>
              <li>
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                <span>Kerusakan bukan disebabkan oleh kelalaian pemakaian (terkena air, jatuh/pecah, atau tegangan korsleting).</span>
              </li>
              <li>
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                <span>Cukup tunjukkan nomor tiket servis ini atau nota fisik saat berkunjung ke toko kami.</span>
              </li>
            </ul>
          </div>
        `;
      } 
      // -------------------------------------------------------------
      // FASE 1: TIKET DALAM ANTREAN / PENGERJAAN / SIAP DIAMBIL
      // -------------------------------------------------------------
      else if (!isCancelled) {
        html += `
          <div class="stepper-container">
            <div class="stepper-title">Progres Pengerjaan Servis</div>
            <div class="stepper">
              <!-- Step 1: Diterima -->
              <div class="step-item ${currentStepIndex >= 0 ? (currentStepIndex === 0 ? 'active' : 'completed') : ''}">
                <div class="step-icon-wrap">
                  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                </div>
                <div class="step-content">
                  <div class="step-title">
                    Unit Diterima
                    ${currentStepIndex === 0 ? '<span class="step-badge">Antrean Masuk</span>' : ''}
                  </div>
                  <div class="step-subtitle">Perangkat telah terdata di sistem servis kami</div>
                </div>
              </div>

              <!-- Step 2: Analisa / Pending Part -->
              <div class="step-item ${currentStepIndex >= 1 ? (currentStepIndex === 1 ? 'active' : 'completed') : ''}">
                <div class="step-icon-wrap">
                  <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
                <div class="step-content">
                  <div class="step-title">
                    ${statusLower === 'pending_part' ? 'Menunggu Sparepart' : 'Pengecekan & Analisa'}
                    ${currentStepIndex === 1 ? '<span class="step-badge">' + (statusLower === 'pending_part' ? 'Menunggu Part' : 'Sedang Analisa') + '</span>' : ''}
                  </div>
                  <div class="step-subtitle">${statusLower === 'pending_part' ? 'Komponen sparepart sedang disiapkan' : 'Teknisi memeriksa detail kerusakan'}</div>
                </div>
              </div>

              <!-- Step 3: Pengerjaan -->
              <div class="step-item ${currentStepIndex >= 2 ? (currentStepIndex === 2 ? 'active' : 'completed') : ''}">
                <div class="step-icon-wrap">
                  <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                </div>
                <div class="step-content">
                  <div class="step-title">
                    Sedang Dikerjakan
                    ${currentStepIndex === 2 ? '<span class="step-badge">Proses Servis</span>' : ''}
                  </div>
                  <div class="step-subtitle">Perbaikan hardware / software sedang berjalan</div>
                </div>
              </div>

              <!-- Step 4: Selesai -->
              <div class="step-item ${currentStepIndex >= 3 ? (currentStepIndex === 3 ? 'active' : 'completed') : ''}">
                <div class="step-icon-wrap">
                  <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
                </div>
                <div class="step-content">
                  <div class="step-title">
                    Selesai / Siap Diambil
                    ${currentStepIndex === 3 ? '<span class="step-badge" style="background:var(--success-bg);color:var(--success-light);">Siap Ambil</span>' : ''}
                  </div>
                  <div class="step-subtitle">Unit selesai diperbaiki dan siap diambil di toko</div>
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        // BATAL
        html += `
          <div style="background:var(--danger-bg);border:1px solid rgba(239,68,68,0.3);border-radius:14px;padding:16px;margin-bottom:16px;text-align:center;">
            <div style="font-size:1.1rem;font-weight:700;color:var(--danger);margin-bottom:4px;">Servis Dibatalkan</div>
            <p style="font-size:0.85rem;color:var(--text-muted);">Pengerjaan tiket ini telah dibatalkan. Silakan hubungi kasir atau teknisi kami untuk serah terima unit kembali.</p>
          </div>
        `;
      }

      // -------------------------------------------------------------
      // DATA DETAIL PERANGKAT & ESTIMASI BIAYA
      // -------------------------------------------------------------
      const estCost = Number(ticket.estimated_cost) || 0;
      const downPay = Number(ticket.down_payment) || 0;
      const sisaCost = Math.max(0, estCost - downPay);

      html += `
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">Pelanggan</span>
              <span class="info-value">${customerName}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Tipe Perangkat</span>
              <span class="info-value">${deviceName}</span>
            </div>
            <div class="info-item full-width">
              <span class="info-label">Keluhan Kerusakan</span>
              <span class="info-value">${ticket.issue_description || '-'}</span>
            </div>
            ${ticket.technician_notes ? `
              <div class="info-item full-width">
                <span class="info-label">Catatan Teknisi</span>
                <span class="info-value" style="color:var(--primary-light);">${ticket.technician_notes}</span>
              </div>
            ` : ''}
            <div class="info-item">
              <span class="info-label">Estimasi Biaya</span>
              <span class="info-value highlight">${formatRupiah(estCost)}</span>
            </div>
            <div class="info-item">
              <span class="info-label">${downPay > 0 ? 'Sisa Biaya (DP ' + formatRupiah(downPay) + ')' : 'Status Bayar'}</span>
              <span class="info-value" style="color:${isPickedUpOrPaid ? 'var(--success-light)' : (downPay > 0 ? 'var(--warning)' : 'var(--text-main)')};">
                ${isPickedUpOrPaid ? 'LUNAS' : (downPay > 0 ? formatRupiah(sisaCost) : 'Belum Lunas')}
              </span>
            </div>
            <div class="info-item full-width">
              <span class="info-label">Waktu Masuk Tiket</span>
              <span class="info-value" style="font-size:0.84rem;color:var(--text-muted);">${formatDate(ticket.created_at)}</span>
            </div>
          </div>

          <!-- Tombol Aksi -->
          <div class="action-group">
            <a href="${waLink}" target="_blank" class="btn btn-wa">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm5.8 14.19c-.24.68-1.2 1.25-1.68 1.31-.48.06-1.1.08-1.78-.14-.41-.13-.94-.3-1.63-.6-2.9-1.27-4.78-4.23-4.93-4.43-.14-.2-1.18-1.57-1.18-2.99 0-1.42.74-2.12 1-2.39.27-.27.59-.34.79-.34.2 0 .4 0 .57.01.19.01.44-.07.68.51.25.59.84 2.06.92 2.21.07.16.12.34.02.54-.1.2-.15.32-.3.5-.15.17-.32.39-.45.52-.15.15-.31.31-.13.62.18.31.78 1.29 1.68 2.09 1.15 1.03 2.13 1.35 2.43 1.5.31.15.48.13.66-.08.18-.2.77-.9 1-.1.2.19.23.4.15.6-.08.2-.4.81-1.08 1.49z"/></svg>
              Chat WhatsApp Toko
            </a>
            <button onclick="fetchTicketData('${ticket.ticket_number}')" class="btn btn-refresh">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              Perbarui Status (Refresh)
            </button>
          </div>
        </div>
      `;

      main.innerHTML = html;
    }

    // Tampilan Jika Tiket Tidak Ditemukan
    function renderNotFound(ticketNo) {
      const main = document.getElementById('content-area');
      main.innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
            </div>
            <h3>Tiket Tidak Ditemukan</h3>
            <p>Nomor tiket <strong>#${ticketNo}</strong> tidak ditemukan pada database servis cloud kami. Mohon pastikan nomor tiket sudah benar atau periksa kembali nota Anda.</p>
            <div class="action-group">
              <button onclick="document.getElementById('ticket-input').focus()" class="btn btn-refresh">
                Cari Nomor Tiket Lain
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Tampilan Error Koneksi
    function renderError(msg) {
      const main = document.getElementById('content-area');
      main.innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="empty-icon" style="background:var(--danger-bg);">
              <svg viewBox="0 0 24 24" style="fill:var(--danger);"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
            <h3>Koneksi Terputus</h3>
            <p>${msg}</p>
            <div class="action-group">
              <button onclick="fetchTicketData(currentTicketNumber)" class="btn btn-refresh">
                Coba Lagi
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Salin ke Clipboard
    function copyTicket(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`No. Tiket #${text} berhasil disalin!`);
      }).catch(() => {
        showToast(`No. Tiket: ${text}`);
      });
    }

    // Tampilkan Notifikasi Toast
    function showToast(message) {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.classList.add('show');
      setTimeout(() => {
        t.classList.remove('show');
      }, 2500);
    }
  </script>
</body>
</html>
